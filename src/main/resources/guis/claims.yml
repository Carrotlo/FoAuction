title: "ᴄʟᴀɪᴍ ʙᴏx | ᴘᴀɢᴇ {page}"
rows: 6
filler:
  enabled: true
  material: "GRAY_STAINED_GLASS_PANE"
  name: " "
  lore: []
  item-flags:
    - "HIDE_ATTRIBUTES"
    - "HIDE_ENCHANTS"
buttons:
  back:
    slot: 49
    enabled: true
    material: "IRON_DOOR"
    name: ":iron_door: {theme}&lBACK"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fReturn to the previous menu."
      - " "
      - "{good}→ Click to Go Back ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "claims.back"
  refresh:
    slot: 48
    enabled: true
    material: "MAP"
    name: ":map: {theme}&lREFRESH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fRefresh your claim box."
      - " "
      - "{good}→ Click to Refresh ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "claims.refresh"
entries:
  previous:
    slots:
      - 45
    item:
      material: "ARROW"
      name: ":arrow: {theme}&lPREVIOUS PAGE"
      lore:
        - "&8ʙᴜᴛᴛᴏɴ"
        - " "
        - "&eⓘ Information ↓"
        - "&7&l | &fPage {page}/{max_page}."
        - " "
        - "{good}→ Click to Previous Page ←"
      glow: true
      item-flags:
        - "HIDE_ATTRIBUTES"
        - "HIDE_ENCHANTS"
    actions:
      left: "claims.previous"
      right: "claims.previous"
  next:
    slots:
      - 53
    item:
      material: "ARROW"
      name: ":arrow: {theme}&lNEXT PAGE"
      lore:
        - "&8ʙᴜᴛᴛᴏɴ"
        - " "
        - "&eⓘ Information ↓"
        - "&7&l | &fPage {page}/{max_page}."
        - " "
        - "{good}→ Click to Next Page ←"
      glow: true
      item-flags:
        - "HIDE_ATTRIBUTES"
        - "HIDE_ENCHANTS"
    actions:
      left: "claims.next"
      right: "claims.next"
  claims:
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    source-item:
      lore-states:
        item:
          mode: "append"
          lines:
            - ""
            - "{white}Created: {theme}{created}"
            - ""
            - "{white}Click to claim this item"
        item-note:
          mode: "append"
          lines:
            - ""
            - "{white}Note: {theme}{note}"
            - "{white}Created: {theme}{created}"
            - ""
            - "{white}Click to claim this item"
        money:
          mode: "preserve"
        money-note:
          mode: "preserve"
        invalid:
          mode: "preserve"
    empty-item:
      material: "LIGHT_GRAY_STAINED_GLASS_PANE"
      name: " "
      lore: []
      item-flags:
        - "HIDE_ATTRIBUTES"
        - "HIDE_ENCHANTS"
    actions:
      left: "claims.claim"
      right: "claims.claim"
      shift-left: "claims.claim"
      shift-right: "claims.claim"
states:
  money:
    material: "SUNFLOWER"
    name: "{theme}ᴄʟᴀɪᴍ ᴍᴏɴᴇʏ"
    lore:
      - "{white}Amount: {theme}{amount}"
      - "{white}Created: {theme}{created}"
      - ""
      - "{white}Click to claim this money"
  money-note:
    material: "SUNFLOWER"
    name: "{theme}ᴄʟᴀɪᴍ ᴍᴏɴᴇʏ"
    lore:
      - "{white}Amount: {theme}{amount}"
      - "{white}Note: {theme}{note}"
      - "{white}Created: {theme}{created}"
      - ""
      - "{white}Click to claim this money"
  invalid:
    material: "BARRIER"
    name: "{bad}ɪɴᴠᴀʟɪᴅ ᴄʟᴀɪᴍ"
    lore:
      - "{white}This claim cannot be delivered."
