title: "ᴀᴜᴄᴛɪᴏɴ ʜᴏᴜꜱᴇ"
rows: 6
filler:
  enabled: true
  material: "GRAY_STAINED_GLASS_PANE"
  name: " "
  lore: []
  item-flags:
    - "HIDE_ATTRIBUTES"
    - "HIDE_ENCHANTS"
buttons:
  claims:
    slot: 46
    enabled: true
    material: "CHEST_MINECART"
    name: ":chest_minecart: {theme}&lCLAIMS"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fOpen your claim box."
      - " "
      - "{good}→ Click to View Claims ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "main.claims"
  sort:
    slot: 47
    enabled: true
    material: "HOPPER"
    name: ":hopper: {theme}&lSORT"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fOptions:"
      - "{options}"
      - " "
      - "{good}→ Click to Cycle ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "main.sort"
    cycle:
      selected-format: "&7&l | {theme}» {option}"
      unselected-format: "&7&l | {white}• {option}"
  filter:
    slot: 48
    enabled: true
    material: "REDSTONE"
    name: ":redstone: {theme}&lFILTER"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fOptions:"
      - "{options}"
      - " "
      - "{good}→ Click to Cycle ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "main.filter"
    cycle:
      selected-format: "&7&l | {theme}» {option}"
      unselected-format: "&7&l | {white}• {option}"
  refresh:
    slot: 49
    enabled: true
    material: "MAP"
    name: ":map: {theme}&lREFRESH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fRefresh the auction listings."
      - " "
      - "{good}→ Click to Refresh ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "main.refresh"
  manage:
    slot: 50
    enabled: true
    material: "CHEST_MINECART"
    name: ":chest_minecart: {theme}&lMANAGE AUCTIONS"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fView your active auctions."
      - "&7&l | &fCancel any of your listings."
      - " "
      - "{good}→ Click to Manage Auctions ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "main.manage"
  search:
    slot: 51
    enabled: true
    material: "NAME_TAG"
    name: ":name_tag: {theme}&lSEARCH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fCurrent: {current}"
      - " "
      - "{good}→ Click to Search ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "main.search"
  history-or-clear:
    slot: 52
    enabled: true
    material: "BOOK"
    name: ":writable_book: {theme}&lHISTORY"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fView your sold auction history."
      - " "
      - "{good}→ Click to View History ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "main.history-or-clear"
    states:
      clear-search:
        material: "MILK_BUCKET"
        name: ":milk_bucket: {theme}&lCLEAR SEARCH"
        lore:
          - "&8ʙᴜᴛᴛᴏɴ"
          - " "
          - "&eⓘ Information ↓"
          - "&7&l | &fShow all {target}."
          - " "
          - "{good}→ Click to Clear Search ←"
        glow: true
        item-flags:
          - "HIDE_ATTRIBUTES"
          - "HIDE_ENCHANTS"
        clickable: true
entries:
  listings:
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    source-item:
      lore-states:
        buy:
          mode: "append"
          lines:
            - ""
            - "{muted}Seller: {theme}{seller}"
            - "{muted}Price: {theme}{price}"
            - "{muted}Time Left: {theme}{time_left}"
            - ""
            - "{theme}Click to buy"
        buy-admin:
          mode: "append"
          lines:
            - ""
            - "{muted}Seller: {theme}{seller}"
            - "{muted}Price: {theme}{price}"
            - "{muted}Time Left: {theme}{time_left}"
            - ""
            - "{theme}Click to buy"
            - "{muted}Press Drop Key: {theme}Admin remove options"
        container:
          mode: "append"
          lines:
            - ""
            - "{muted}Seller: {theme}{seller}"
            - "{muted}Price: {theme}{price}"
            - "{muted}Time Left: {theme}{time_left}"
            - ""
            - "{theme}Left Click to buy"
            - "{theme}Right Click to preview"
        container-admin:
          mode: "append"
          lines:
            - ""
            - "{muted}Seller: {theme}{seller}"
            - "{muted}Price: {theme}{price}"
            - "{muted}Time Left: {theme}{time_left}"
            - ""
            - "{theme}Left Click to buy"
            - "{theme}Right Click to preview"
            - "{muted}Press Drop Key: {theme}Admin remove options"
    actions:
      left: "listing.select"
      right: "listing.preview"
      shift-left: "listing.select"
      shift-right: "listing.preview"
      drop: "listing.admin"
      control-drop: "listing.admin"
    empty-item:
      material: "LIGHT_GRAY_STAINED_GLASS_PANE"
      name: " "
      lore: []
      item-flags:
        - "HIDE_ATTRIBUTES"
        - "HIDE_ENCHANTS"
  previous:
    slots:
      - 45
    item:
      material: "ARROW"
      name: ":arrow: {theme}&lPREVIOUS PAGE"
      lore:
        - "&8ʙᴜᴛᴛᴏɴ"
        - " "
        - "&eⓘ Information ↓"
        - "&7&l | &fPage {page}/{max_page}."
        - " "
        - "{good}→ Click to Previous Page ←"
      glow: true
      item-flags:
        - "HIDE_ATTRIBUTES"
        - "HIDE_ENCHANTS"
    actions:
      left: "main.previous"
      right: "main.previous"
  next:
    slots:
      - 53
    item:
      material: "ARROW"
      name: ":arrow: {theme}&lNEXT PAGE"
      lore:
        - "&8ʙᴜᴛᴛᴏɴ"
        - " "
        - "&eⓘ Information ↓"
        - "&7&l | &fPage {page}/{max_page}."
        - " "
        - "{good}→ Click to Next Page ←"
      glow: true
      item-flags:
        - "HIDE_ATTRIBUTES"
        - "HIDE_ENCHANTS"
    actions:
      left: "main.next"
      right: "main.next"
