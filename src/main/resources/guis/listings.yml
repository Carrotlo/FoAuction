title: "ᴍᴀɴᴀɢᴇ ᴀᴜᴄᴛɪᴏɴꜱ | ᴘᴀɢᴇ {page}"
rows: 6
filler:
  enabled: true
  material: "GRAY_STAINED_GLASS_PANE"
  name: " "
  lore: []
  item-flags:
    - "HIDE_ATTRIBUTES"
    - "HIDE_ENCHANTS"
buttons:
  back:
    slot: 49
    enabled: true
    material: "IRON_DOOR"
    name: ":iron_door: {theme}&lBACK"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fReturn to the previous menu."
      - " "
      - "{good}→ Click to Go Back ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "listings.back"
  sort:
    slot: 47
    enabled: true
    material: "HOPPER"
    name: ":hopper: {theme}&lSORT"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fOptions:"
      - "{options}"
      - " "
      - "{good}→ Click to Cycle ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "listings.sort"
    cycle:
      selected-format: "&7&l | {theme}» {option}"
      unselected-format: "&7&l | {white}• {option}"
  refresh:
    slot: 48
    enabled: true
    material: "MAP"
    name: ":map: {theme}&lREFRESH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fRefresh your listings."
      - " "
      - "{good}→ Click to Refresh ←"
    glow: true
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ENCHANTS"
    action: "listings.refresh"
entries:
  listings:
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    source-item:
      lore-states:
        owner:
          mode: "append"
          lines:
            - ""
            - "{muted}Seller: {theme}{seller}"
            - "{muted}Price: {theme}{price}"
            - "{muted}Time Left: {theme}{time_left}"
            - ""
            - "{theme}Click to cancel"
    actions:
      left: "listing.cancel"
      right: "listing.cancel"
      shift-left: "listing.cancel"
      shift-right: "listing.cancel"
      drop: "listing.cancel"
      control-drop: "listing.cancel"
    empty-item:
      material: "LIGHT_GRAY_STAINED_GLASS_PANE"
      name: " "
      lore: []
      item-flags:
        - "HIDE_ATTRIBUTES"
        - "HIDE_ENCHANTS"
  previous:
    slots:
      - 45
    item:
      material: "ARROW"
      name: ":arrow: {theme}&lPREVIOUS PAGE"
      lore:
        - "&8ʙᴜᴛᴛᴏɴ"
        - " "
        - "&eⓘ Information ↓"
        - "&7&l | &fPage {page}/{max_page}."
        - " "
        - "{good}→ Click to Previous Page ←"
      glow: true
      item-flags:
        - "HIDE_ATTRIBUTES"
        - "HIDE_ENCHANTS"
    actions:
      left: "listings.previous"
      right: "listings.previous"
  next:
    slots:
      - 53
    item:
      material: "ARROW"
      name: ":arrow: {theme}&lNEXT PAGE"
      lore:
        - "&8ʙᴜᴛᴛᴏɴ"
        - " "
        - "&eⓘ Information ↓"
        - "&7&l | &fPage {page}/{max_page}."
        - " "
        - "{good}→ Click to Next Page ←"
      glow: true
      item-flags:
        - "HIDE_ATTRIBUTES"
        - "HIDE_ENCHANTS"
    actions:
      left: "listings.next"
      right: "listings.next"
