# Claim box GUI. Money claims remain for older data; new sales pay sellers directly.
title: "ᴄʟᴀɪᴍ ʙᴏx"
content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
items:
  previous:
    slot: 45
    name: ":arrow: {theme}&lPREVIOUS PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page}/{max_page}."
      - " "
      - "{good}→ Click to Previous Page ←"
  back:
    slot: 49
    name: ":iron_door: {theme}&lBACK"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fReturn to the previous menu."
      - " "
      - "{good}→ Click to Go Back ←"
  refresh:
    slot: 48
    material: MAP
    name: ":map: {theme}&lREFRESH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fRefresh your claim box."
      - " "
      - "{good}→ Click to Refresh ←"
  next:
    slot: 53
    name: ":arrow: {theme}&lNEXT PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page}/{max_page}."
      - " "
      - "{good}→ Click to Next Page ←"

# Text appended to claim entries. Names/lore of the claimed item itself stay untouched.
claim-entry:
  separator: ""
  action-separator: ""
  item:
    note: "{white}Note: {theme}{note}"
    created: "{white}Created: {theme}{created}"
    action: "{white}Click to claim this item"
  money:
    name: "{theme}ᴄʟᴀɪᴍ ᴍᴏɴᴇʏ"
    amount: "{white}Amount: {theme}{amount}"
    note: "{white}Note: {theme}{note}"
    created: "{white}Created: {theme}{created}"
    action: "{white}Click to claim this money"
  invalid:
    name: "{bad}ɪɴᴠᴀʟɪᴅ ᴄʟᴀɪᴍ"
    lore:
      - "{white}This claim cannot be delivered."
