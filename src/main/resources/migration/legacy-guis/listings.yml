# Manage Auctions GUI. Slots are 0-based Minecraft inventory slots.
title: "ᴍᴀɴᴀɢᴇ ᴀᴜᴄᴛɪᴏɴꜱ"
content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
items:
  previous:
    slot: 45
    name: ":arrow: {theme}&lPREVIOUS PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page}/{max_page}."
      - " "
      - "{good}→ Click to Previous Page ←"
  back:
    slot: 49
    name: ":iron_door: {theme}&lBACK"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fReturn to the previous menu."
      - " "
      - "{good}→ Click to Go Back ←"
  sort:
    slot: 47
    material: HOPPER
    name: ":hopper: {theme}&lSORT"
    # Labels only. FoPluginCore keeps the colors and selection markers fixed.
    lore-options:
      - "Highest Price"
      - "Lowest Price"
      - "Most Recent"
      - "Least Recent"
  refresh:
    slot: 48
    material: MAP
    name: ":map: {theme}&lREFRESH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fRefresh your listings."
      - " "
      - "{good}→ Click to Refresh ←"
  next:
    slot: 53
    name: ":arrow: {theme}&lNEXT PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page}/{max_page}."
      - " "
      - "{good}→ Click to Next Page ←"
