# Buy/sell confirmation GUI.
# Placeholders in confirm/cancel lore: {price}, {fee}
sell-title: "ᴄᴏɴꜰɪʀᴍᴀᴛɪᴏɴ"
buy-title: "ᴄᴏɴꜰɪʀᴍᴀᴛɪᴏɴ"
items:
  preview:
    slot: 13
  cancel:
    slot: 11
    material: RED_STAINED_GLASS_PANE
    name: ":red_stained_glass_pane: {bad}&lCANCEL"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPrice: {theme}{price}"
      - "&7&l | &fFee: {theme}{fee}"
      - " "
      - "{good}→ Click to Cancel ←"
  confirm:
    slot: 15
    material: LIME_STAINED_GLASS_PANE
    name: ":lime_stained_glass_pane: {good}&lCONFIRM"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPrice: {theme}{price}"
      - "&7&l | &fFee: {theme}{fee}"
      - " "
      - "{good}→ Click to Confirm Purchase ←"

# Lore added to the item preview. The item name/lore supplied by the player or listing stays untouched.
preview-lore:
  separator: ""
  sell:
    - "{white}Selling for: {theme}{price}"
    - "{white}Listing fee: {theme}{fee}"
  buy:
    - "{white}Seller: {theme}{seller}"
    - "{white}Buying for: {theme}{price}"
