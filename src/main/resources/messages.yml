# Edit optional item icons here. Remove any :icon: token to hide it.
# Unsupported servers, older Java clients, and Bedrock players automatically receive clean text without item sprites.
# Editable message bodies and tokens.
# Put {prefix} inside every message that should show the prefix.
# Change tokens.prefix to edit what {prefix} resolves to.
# Color tokens support #RRGGBB, <#RRGGBB>, and & color codes.

tokens:
  prefix: ":diamond: {theme}FoAuction &8» {muted}"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  good: "#3ecf8e"
  bad: "#ff5d73"

# Labels supplied to Core's sort/filter cycle controls. Order follows the gameplay modes.
gui-options:
  main:
    sort: ["Highest Price", "Lowest Price", "Most Recent", "Least Recent"]
    filter: ["All", "Weapons", "Armor", "Tools", "Blocks", "Food", "Farm", "Redstone", "Potions", "Misc"]
  listings:
    sort: ["Highest Price", "Lowest Price", "Most Recent", "Least Recent"]
  seller-view:
    sort: ["Highest Price", "Lowest Price", "Most Recent", "Least Recent"]

gui-values:
  no-search: "{muted}None"
  search-target: "auctions"
  time-expired: "Expired"
  time-days-hours: "{days}d {hours}h"
  time-hours-minutes: "{hours}h {minutes}m"
  time-minutes: "{minutes}m"
  date-format: "yyyy-MM-dd HH:mm"
  date-zone: "system"
  number-locale: "en-US"
  number-pattern: "#,##0.####"
  compact-number-pattern: "0.00"
  compact-suffixes: ["K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td"]
  container: "Container"
  generic-item: "item"
  containers:
    barrel: "Barrel"
    bundle: "Bundle"
    shulker_box: "Shulker Box"
    white_shulker_box: "White Shulker Box"
